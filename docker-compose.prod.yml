# Producción VPS — despliegue con: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bendey_facturador}
      MYSQL_USER: ${MYSQL_USER:-facturador}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - facturador

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - facturador

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-facturador}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-bendey_facturador}?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      WKHTMLTOPDF_PATH: /usr/bin/wkhtmltopdf
      RUN_ADMIN_SEED: ${RUN_ADMIN_SEED:-0}
      RUN_EMPRESAS_IMPORT: ${RUN_EMPRESAS_IMPORT:-0}
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./.env.prod:/var/www/html/.env:ro
      - app_data:/var/www/html/data
      - fiscal_storage:/var/www/html/var/fiscal_storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facturador

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-facturador}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-bendey_facturador}?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      WKHTMLTOPDF_PATH: /usr/bin/wkhtmltopdf
    command: ["php", "bin/console", "app:fiscal:worker"]
    healthcheck:
      disable: true
    volumes:
      - ./.env.prod:/var/www/html/.env:ro
      - app_data:/var/www/html/data
      - fiscal_storage:/var/www/html/var/fiscal_storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facturador

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-facturador}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      # Solo localhost en VPS; accede vía túnel SSH o reverse proxy con auth
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - facturador

networks:
  facturador:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_data:
  fiscal_storage:
