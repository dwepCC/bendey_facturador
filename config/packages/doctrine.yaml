doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            # Credenciales de empresa cifradas en reposo (clave SOL, secretos GRE y API de validez).
            encrypted_string: App\Doctrine\Type\EncryptedStringType
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            url: 'sqlite:///%kernel.project_dir%/var/data/test.db'
        orm:
            auto_generate_proxy_classes: true
            validate_xml_mapping: false
