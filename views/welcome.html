<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bendey — Facturador SUNAT</title>
    <meta name="description" content="Bendey Facturador SUNAT — servicio de facturación electrónica">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef2ff;
            --bg-card: #ffffff;
            --accent: #4f46e5;
            --accent-teal: #0d9488;
            --accent-soft: rgba(79, 70, 229, 0.12);
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(145deg, #eef2ff 0%, #faf5ff 50%, #f0fdfa 100%);
            color: var(--text);
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 70% 50% at 20% 0%, rgba(79, 70, 229, 0.15), transparent 50%),
                radial-gradient(ellipse 60% 40% at 90% 90%, rgba(13, 148, 136, 0.12), transparent 45%),
                linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            pointer-events: none;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: 0.4;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 520px;
        }

        .logo {
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0 0 0.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin: 0 0 2.5rem;
            line-height: 1.5;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem 2rem;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.1);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin: 0 0 0.5rem;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text);
            margin: 0 0 1.25rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            border: none;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .btn:hover {
            background: #5558e3;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 1.1em;
            height: 1.1em;
        }

        .links {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .links a {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .links a:hover {
            color: var(--accent);
        }

        .version {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <main class="page">
        <div class="content">
            <h1 class="logo">Bendey<span> Facturador SUNAT</span></h1>
            <p class="tagline">Plataforma interna de facturación electrónica Bendey. Ingrese con su cuenta para ver el monitoreo.</p>

            <div class="card">
                <p class="card-title">Acceso</p>
                <p class="card-desc">Use el acceso administrativo para entrar al panel de monitoreo fiscal.</p>
                <a href="/login" class="btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <path d="M10 17l5-5-5-5"/>
                        <path d="M15 12H3"/>
                    </svg>
                    Ingresar al panel
                </a>
            </div>

            <div class="links">
                <a href="/login">Ir a inicio de sesión</a>
            </div>

            <p class="version">Bendey Facturador SUNAT</p>
        </div>
    </main>
</body>
</html>
