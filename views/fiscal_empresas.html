<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empresas — Panel Fiscal</title>
  <link rel="stylesheet" href="__FISCAL_CSS__">
</head>
<body class="fiscal-ui">
  <div class="dash-shell">
    <header class="dash-header">
      <div class="dash-title-wrap">
        <h1>Empresas registradas</h1>
        <p>Conexión SUNAT directo o PSE por tenant</p>
      </div>
      <div class="dash-user">
        __DASH_NAV__
        <span>Sesión: <strong>__USERNAME__</strong></span>
        <a href="/change-password">Cambiar contraseña</a>
        <a href="/logout">Salir</a>
      </div>
    </header>

    <div class="dash-card dash-filters">
      <input id="ruc" placeholder="RUC (11 dígitos)" maxlength="11">
      <input id="tenant_slug" placeholder="Tenant slug">
      <input id="q" placeholder="Buscar (RUC, tenant, proveedor…)">
      <input id="from" type="date" title="Última verificación desde">
      <input id="to" type="date" title="Última verificación hasta">
      <select id="send_mode">
        <option value="">Modo envío</option>
        <option value="sunat_direct">SUNAT directo</option>
        <option value="pse">PSE</option>
      </select>
      <select id="connection_status">
        <option value="">Estado conexión</option>
        <option value="connected">Conectado</option>
        <option value="testing">En prueba</option>
        <option value="invalid_credentials">Credenciales inválidas</option>
        <option value="certificate_expired">Certificado vencido</option>
        <option value="configuration_missing">Configuración incompleta</option>
        <option value="error">Error</option>
      </select>
      <select id="enabled">
        <option value="">Todas</option>
        <option value="1">Solo activas</option>
        <option value="0">Solo inactivas</option>
      </select>
      <button class="btn btn-indigo" id="btnLoad" type="button">Filtrar</button>
      <button class="btn btn-slate" id="btnRefresh" type="button">Actualizar</button>
    </div>
    <p class="hint-muted dash-hint">El rango de fechas filtra por <strong>última verificación de conexión</strong>.</p>

    <div class="dash-card">
      <div class="table-wrap">
        <table class="dash-table">
          <thead>
            <tr>
              <th>RUC</th>
              <th>Tenant</th>
              <th>Ambiente</th>
              <th>Modo</th>
              <th>Proveedor</th>
              <th>Conexión</th>
              <th>Última verificación</th>
              <th>Usuario SOL</th>
              <th>Activa</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <p class="pager" id="pager"></p>
        <div class="pager-controls">
          <button class="btn btn-slate" id="btnPrev" type="button">Anterior</button>
          <button class="btn btn-slate" id="btnNext" type="button">Siguiente</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '__API_BASE__';
    const fetchOpts = { credentials: 'same-origin' };
    const pageState = { offset: 0, limit: 25, total: 0 };

    const qs = id => document.getElementById(id);

    const connLabel = {
      connected: 'Conectado',
      testing: 'En prueba',
      invalid_credentials: 'Credenciales inválidas',
      certificate_expired: 'Certificado vencido',
      configuration_missing: 'Config. incompleta',
      error: 'Error'
    };

    const envLabel = { produccion: 'Producción', pruebas: 'Pruebas', demo: 'Demo' };

    function formatDate(d) {
      if (!d) return '—';
      const dt = new Date(d);
      if (Number.isNaN(dt.getTime())) return d;
      return dt.toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'short' });
    }

    function connBadgeClass(st) {
      const s = String(st || '').toLowerCase();
      if (s === 'connected' || s === 'testing') return ' badge-ok';
      if (s === 'configuration_missing') return ' badge-warn';
      return ' badge-err';
    }

    function currentFilters() {
      const enabled = qs('enabled').value;
      const f = {
        ruc: qs('ruc').value.trim(),
        tenant_slug: qs('tenant_slug').value.trim(),
        q: qs('q').value.trim(),
        from: qs('from').value,
        to: qs('to').value,
        send_mode: qs('send_mode').value,
        connection_status: qs('connection_status').value
      };
      if (enabled !== '') f.enabled = enabled === '1';
      return f;
    }

    const url = (p, params) => {
      const u = new URL(API + p, location.origin);
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v !== '' && v != null && v !== false) u.searchParams.set(k, v);
      });
      return u;
    };

    async function apiFetch(u, opts) {
      const r = await fetch(u, Object.assign({}, fetchOpts, opts || {}));
      if (r.status === 401 || r.status === 403) {
        location.href = '/login';
        throw new Error('Sesión expirada');
      }
      return r;
    }

    async function loadList() {
      const params = Object.assign({}, currentFilters(), {
        offset: pageState.offset,
        limit: pageState.limit,
        include_total: '1'
      });
      const r = await apiFetch(url('/companies', params));
      if (!r.ok) {
        qs('rows').innerHTML = '<tr><td colspan="9">Error al cargar empresas</td></tr>';
        return;
      }
      const data = await r.json();
      pageState.total = data.total ?? 0;
      const items = data.items || [];
      const tbody = qs('rows');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="9">Sin resultados</td></tr>';
      } else {
        tbody.innerHTML = items.map(row => {
          const conn = row.connection_status || '';
          const err = row.connection_error ? `<br><small class="hint-muted">${escapeHtml(row.connection_error)}</small>` : '';
          const mode = row.send_mode_label || (row.send_mode === 'pse' ? 'PSE' : 'SUNAT directo');
          const amb = envLabel[String(row.ambiente || '').toLowerCase()] || row.ambiente || '—';
          return `<tr>
            <td><code>${escapeHtml(row.ruc || '')}</code></td>
            <td>${escapeHtml(row.tenant_slug || '—')}</td>
            <td>${escapeHtml(amb)}</td>
            <td><span class="badge${row.send_mode === 'pse' ? ' badge-warn' : ' badge-ok'}">${escapeHtml(mode)}</span></td>
            <td>${escapeHtml(row.provider || '—')}</td>
            <td><span class="badge${connBadgeClass(conn)}">${escapeHtml(connLabel[conn] || conn || '—')}</span>${err}</td>
            <td>${formatDate(row.last_connection_check)}</td>
            <td>${escapeHtml(row.sol_user || '—')}</td>
            <td>${row.enabled ? 'Sí' : 'No'}</td>
          </tr>`;
        }).join('');
      }
      const from = pageState.total ? pageState.offset + 1 : 0;
      const to = Math.min(pageState.offset + pageState.limit, pageState.total);
      qs('pager').textContent = pageState.total
        ? `Mostrando ${from}–${to} de ${pageState.total}`
        : 'Sin registros';
      qs('btnPrev').disabled = pageState.offset <= 0;
      qs('btnNext').disabled = pageState.offset + pageState.limit >= pageState.total;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    qs('btnLoad').addEventListener('click', () => { pageState.offset = 0; loadList(); });
    qs('btnRefresh').addEventListener('click', () => loadList());
    qs('btnPrev').addEventListener('click', () => {
      pageState.offset = Math.max(0, pageState.offset - pageState.limit);
      loadList();
    });
    qs('btnNext').addEventListener('click', () => {
      if (pageState.offset + pageState.limit < pageState.total) {
        pageState.offset += pageState.limit;
        loadList();
      }
    });

    loadList();
  </script>
</body>
</html>
